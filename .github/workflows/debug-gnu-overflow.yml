# Throwaway: stress rustc to reproduce rust-lang/rust#139070
# (random STATUS_STACK_OVERFLOW on windows-gnu) and check a fix.
#
# A/B test with CI artifacts installed by rustup-toolchain-install-master:
# `baseline` is a master commit, `fix` is a try build on top of it
# (try job `dist-x86_64-mingw`).
name: Debug windows-gnu stack overflow

on:
  push:
    branches:
      - debug-gnu-overflow
  workflow_dispatch:
    inputs:
      iterations:
        description: rustc invocations per job (default depends on the job)
        default: ''

permissions:
  contents: read

env:
  # Parent of the fix: the master commit the try build is based on.
  BASELINE_SHA: c7d5ba59d8e11ee2e2204b173458eec4cb41c973
  # Try build with the `build_scoped` join fix.
  FIX_SHA: 6ebbc66bff3bc876e9d5803b8679e85d633cb635

jobs:
  stress:
    name: >-
      ${{ matrix.build }}
      ${{ matrix.driver && 'driver' || 'rustc.exe' }}
      ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        build: [baseline, fix]
        shard: [1, 2, 3, 4]
        include:
          # Stock rustc.exe, the actual symptom: about 1 in 30k runs.
          - { iterations: '100000' }
          # The driver crashes about 1 in 5k runs, so fewer runs show the difference.
          - { build: baseline, shard: d1, driver: 1, iterations: '50000' }
          - { build: baseline, shard: d2, driver: 1, iterations: '50000' }
          - { build: fix, shard: d1, driver: 1, iterations: '50000' }
          - { build: fix, shard: d2, driver: 1, iterations: '50000' }
    env:
      TOOLCHAIN: ${{ matrix.build }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install rustup-toolchain-install-master
      run: cargo install --locked rustup-toolchain-install-master@1.12.2
    - name: Install toolchain
      shell: pwsh
      run: |
        $sha = if ($env:TOOLCHAIN -eq 'fix') { $env:FIX_SHA } else { $env:BASELINE_SHA }
        if (-not $sha) { throw "no commit SHA for $env:TOOLCHAIN" }
        $components = @('-c', 'cargo')
        if ('${{ matrix.driver }}') { $components += @('-c', 'rustc-dev', '-c', 'rust-mingw') }
        rustup-toolchain-install-master $sha --channel nightly --host x86_64-pc-windows-gnu -n $env:TOOLCHAIN @components
        rustc +$env:TOOLCHAIN -vV
    - name: Build overflow driver
      if: matrix.driver
      shell: pwsh
      run: |
        cargo +${{ env.TOOLCHAIN }} build --release --manifest-path ci/overflow-driver/Cargo.toml
        # Next to rustc.exe, so it finds the sysroot and rustc_driver DLL.
        $exe = Join-Path (Split-Path (rustup which --toolchain ${{ env.TOOLCHAIN }} rustc)) 'rustc-veh.exe'
        Copy-Item ci/overflow-driver/target/release/overflow-driver.exe $exe
        "RUSTC_VEH=$exe" >> $env:GITHUB_ENV
    - name: Self-test overflow driver
      if: matrix.driver
      shell: pwsh
      run: |
        $env:OVERFLOW_DRIVER_SELFTEST = '1'
        $out = & $env:RUSTC_VEH --version 2>&1 | Out-String
        Write-Host "exit: $LASTEXITCODE"
        ($out -split "`n" | Select-Object -First 40) -join "`n" | Write-Host
        if ($out -notmatch '\[overflow-driver\] frames: \d+') { throw 'handler printed no frames' }
        exit 0
    - name: Stress rustc
      shell: pwsh
      # `-Zthreads=2` explicitly, so the result does not depend on the build's default.
      run: >
        ci/debug-gnu-overflow.ps1
        -Toolchain ${{ env.TOOLCHAIN }}
        -Threads 2
        -Iterations ${{ inputs.iterations || matrix.iterations }}
        -OutDir stress-out
        ${{ matrix.driver && '-RustcPath $env:RUSTC_VEH' || '' }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ matrix.build }}-${{ matrix.driver && 'driver' || 'rustc' }}-${{ matrix.shard }}
        path: stress-out
        if-no-files-found: ignore
