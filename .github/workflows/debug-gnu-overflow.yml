# Throwaway: stress rustc to reproduce rust-lang/rust#139070
# (random STATUS_STACK_OVERFLOW on windows-gnu) and grab crash dumps.
name: Debug windows-gnu stack overflow

on:
  push:
    branches:
      - debug-gnu-overflow
  workflow_dispatch:
    inputs:
      iterations:
        description: rustc invocations per job
        default: '20000'

permissions:
  contents: read

jobs:
  stress:
    name: ${{ matrix.toolchain }} threads=${{ matrix.threads }}${{ matrix.capture && format(' cdb {0}', matrix.capture) || '' }}${{ matrix.parallel && format(' p{0}', matrix.parallel) || '' }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same config as the cargo CI failures, under more CPU contention.
          - toolchain: nightly-x86_64-pc-windows-gnu
            threads: default
            parallel: 16
            iterations: '40000'
          # Run probes under cdb to dump the first-chance overflow.
          # Hits are about 1 in 10k runs, so spread over several jobs.
          - { toolchain: nightly-x86_64-pc-windows-gnu, threads: default, capture: 1, iterations: '20000' }
          - { toolchain: nightly-x86_64-pc-windows-gnu, threads: default, capture: 2, iterations: '20000' }
          - { toolchain: nightly-x86_64-pc-windows-gnu, threads: default, capture: 3, iterations: '20000' }
          - { toolchain: nightly-x86_64-pc-windows-gnu, threads: default, capture: 4, iterations: '20000' }
          - { toolchain: nightly-x86_64-pc-windows-gnu, threads: default, capture: 5, iterations: '20000' }
          - { toolchain: nightly-x86_64-pc-windows-gnu, threads: default, capture: 6, iterations: '20000' }
    env:
      DUMP_DIR: ${{ github.workspace }}\dumps
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install toolchain
      run: rustup toolchain install --profile minimal --no-self-update ${{ matrix.toolchain }}
    - name: Stress rustc
      shell: pwsh
      run: >
        ci/debug-gnu-overflow.ps1
        -Toolchain ${{ matrix.toolchain }}
        -Threads ${{ matrix.threads }}
        -Iterations ${{ matrix.iterations || inputs.iterations || '20000' }}
        -OutDir stress-out
        -Parallel ${{ matrix.parallel || 4 }}
        ${{ matrix.capture && '-DumpDir $env:DUMP_DIR' || '' }}
    - name: Print stacks from crash dumps
      if: always() && matrix.capture
      shell: pwsh
      run: |
        Get-ChildItem $env:DUMP_DIR -Filter sov-*.txt -ErrorAction SilentlyContinue | ForEach-Object {
          Write-Host "===== $($_.Name) (logged at the overflow, no symbols)"
          Get-Content $_ | Select-Object -First 400 | Write-Host
        }
        $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
        $dumps = @(Get-ChildItem $env:DUMP_DIR -Filter *.dmp -ErrorAction SilentlyContinue)
        Write-Host "found $($dumps.Count) dump(s)"
        foreach ($d in $dumps | Select-Object -First 3) {
          $log = Join-Path $env:DUMP_DIR "$($d.BaseName)-sym.txt"
          # The faulting stack can be very deep, so raise the frame limit.
          & $cdb -z $d.FullName -logo $log -c '.symfix; .reload; .ecxr; .kframes 0x4000; kn; ~*kn 60; q' | Out-Null
          $lines = Get-Content $log
          Write-Host "===== $($d.Name): $($lines.Count) lines, head"
          $lines | Select-Object -First 200 | Write-Host
          Write-Host "===== $($d.Name): tail"
          $lines | Select-Object -Last 150 | Write-Host
        }
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ matrix.toolchain }}-threads-${{ matrix.threads }}${{ matrix.capture && format('-cdb{0}', matrix.capture) || '' }}${{ matrix.parallel && format('-p{0}', matrix.parallel) || '' }}
        path: |
          stress-out
          dumps
        if-no-files-found: ignore
