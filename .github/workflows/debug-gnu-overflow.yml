# Throwaway: stress rustc to reproduce rust-lang/rust#139070
# (random STATUS_STACK_OVERFLOW on windows-gnu) and grab crash dumps.
name: Debug windows-gnu stack overflow

on:
  push:
    branches:
      - debug-gnu-overflow
  workflow_dispatch:
    inputs:
      iterations:
        description: rustc invocations per job
        default: '30000'

permissions:
  contents: read

jobs:
  stress:
    name: >-
      threads=${{ matrix.threads }}
      ${{ matrix.driver && format('driver {0}', matrix.driver) || '' }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Driver: dump winpthreads state on the exit-time access violation.
          - { threads: default, driver: 1 }
          - { threads: default, driver: 2 }
          - { threads: default, driver: 3 }
    env:
      # Pinned: the driver reads winpthreads globals at RVAs from this build.
      TOOLCHAIN: nightly-2026-11-21-x86_64-pc-windows-gnu
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install toolchain
      run: rustup toolchain install --profile minimal --no-self-update ${{ env.TOOLCHAIN }}
    - name: Build overflow driver
      if: matrix.driver
      shell: pwsh
      run: |
        rustup component add --toolchain ${{ env.TOOLCHAIN }} rustc-dev
        cargo +${{ env.TOOLCHAIN }} build --release --manifest-path ci/overflow-driver/Cargo.toml
        # Next to rustc.exe, so it finds the sysroot and rustc_driver DLL.
        $exe = Join-Path (Split-Path (rustup which --toolchain ${{ env.TOOLCHAIN }} rustc)) 'rustc-veh.exe'
        Copy-Item ci/overflow-driver/target/release/overflow-driver.exe $exe
        "RUSTC_VEH=$exe" >> $env:GITHUB_ENV
    - name: Self-test overflow driver
      if: matrix.driver
      shell: pwsh
      run: |
        $env:OVERFLOW_DRIVER_SELFTEST = '1'
        $out = & $env:RUSTC_VEH --version 2>&1 | Out-String
        Write-Host "exit: $LASTEXITCODE"
        ($out -split "`n" | Select-Object -First 40) -join "`n" | Write-Host
        if ($out -notmatch '\[overflow-driver\] frames: \d+') { throw 'handler printed no frames' }
        exit 0
    - name: Stress rustc
      shell: pwsh
      run: >
        ci/debug-gnu-overflow.ps1
        -Toolchain ${{ env.TOOLCHAIN }}
        -Threads ${{ matrix.threads }}
        -Iterations ${{ inputs.iterations || '30000' }}
        -OutDir stress-out
        ${{ matrix.driver && '-RustcPath $env:RUSTC_VEH' || '' }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: threads-${{ matrix.threads }}${{ matrix.driver && format('-driver{0}', matrix.driver) || '' }}
        path: stress-out
        if-no-files-found: ignore
